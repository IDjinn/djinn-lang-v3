name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            llvm-dir: "C:/Program Files/LLVM/lib/cmake/llvm"
          - name: linux-gcc
            os: ubuntu-24.04
            llvm-dir: "/usr/lib/llvm-22/lib/cmake/llvm"
            extra-configure: -G Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\LLVM-22.1.0-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-win64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y ninja-build llvm-22-dev clang-22
          sudo ln -sf /usr/lib/llvm-22/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/lib/llvm-22/bin/clang++-22 /usr/local/bin/clang++

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm-dir }}" ${{ matrix.extra-configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4

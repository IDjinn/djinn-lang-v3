name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            llvm-dir: "C:/LLVM/lib/cmake/llvm"
          - name: linux-gcc
            os: ubuntu-24.04
            llvm-dir: "/usr/lib/llvm-22/lib/cmake/llvm"
            extra-configure: -G Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          curl.exe -L -o $archive "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz"
          New-Item -ItemType Directory -Force C:\LLVM | Out-Null
          tar -xJf $archive -C C:\LLVM --strip-components=1
          if (-not (Test-Path "C:\LLVM\lib\cmake\llvm\LLVMConfig.cmake")) { throw "LLVMConfig.cmake not found after extraction" }
          Add-Content $env:GITHUB_PATH "C:\LLVM\bin"

      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y ninja-build llvm-22-dev clang-22
          sudo ln -sf /usr/lib/llvm-22/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/lib/llvm-22/bin/clang++-22 /usr/local/bin/clang++

      - name: Provide DIA SDK diaguids.lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK\lib\amd64\diaguids.lib"
          if (Test-Path $expected) { Write-Host "diaguids.lib already present"; exit 0 }
          $found = Get-ChildItem "C:\Program Files\Microsoft Visual Studio", "${env:ProgramFiles(x86)}\Microsoft Visual Studio" -Recurse -Filter diaguids.lib -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            New-Item -ItemType Directory -Force (Split-Path $expected) | Out-Null
            Copy-Item $found.FullName $expected
            Write-Host "Copied diaguids.lib from $($found.FullName)"
          } else {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $libexe = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" | Select-Object -First 1 -ExpandProperty FullName
            "LIBRARY diaguids" | Set-Content "$env:RUNNER_TEMP\diaguids.def"
            New-Item -ItemType Directory -Force (Split-Path $expected) | Out-Null
            & $libexe /def:"$env:RUNNER_TEMP\diaguids.def" /machine:x64 /out:$expected
          }
          if (-not (Test-Path $expected)) { throw "diaguids.lib could not be provided" }

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm-dir }}" ${{ matrix.extra-configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel 4

      - name: Report invalid leftover IR (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in $(find /tmp/djinn_build -name '*.ll' 2>/dev/null); do
            out=$(clang -c -O0 "$f" -o /dev/null 2>&1) || if echo "$out" | grep -q "doesn't match"; then
              echo "=== $f ==="
              line=$(echo "$out" | grep -oE "main.ll:[0-9]+" | head -1 | cut -d: -f2)
              sed -n "$((line-8)),$((line+4))p" "$f"
            fi
          done
